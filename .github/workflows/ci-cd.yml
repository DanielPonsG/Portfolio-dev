name: CI/CD

# En cada pull request: valida tipos, compila y revisa enlaces internos.
# En cada push a main: además publica el sitio en GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos y plantillas
        run: npm run check

      - name: Compilar sitio
        run: npm run build

      - name: Revisar enlaces internos
        run: npm run check:links

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      # El CDN de Pages puede tardar unos segundos en servir la nueva versión.
      - name: Verificar sitio publicado
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for intento in 1 2 3 4 5 6; do
            if curl -fsSL "$PAGE_URL" | grep -q "Daniel Pons" && curl -fsSL -o /dev/null "${PAGE_URL%/}/favicon.svg"; then
              echo "Sitio publicado y respondiendo: $PAGE_URL"
              exit 0
            fi
            echo "Intento $intento: el sitio todavía no responde, reintento en 10 s"
            sleep 10
          done
          echo "::error::El sitio publicado no respondió con el contenido esperado: $PAGE_URL"
          exit 1
