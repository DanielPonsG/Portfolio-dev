version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
    ignore:
      # @astrojs/check todavía no admite TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Los tipos se mantienen en la versión mínima de Node soportada (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
